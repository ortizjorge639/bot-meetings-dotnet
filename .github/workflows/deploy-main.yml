name: Deploy main to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      validate_only:
        description: Check the existing pilot without deploying
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: production
  cancel-in-progress: false

env:
  AZURE_SUBSCRIPTION_ID: cbab996c-0a31-4b66-bdcd-7ead3cad1487
  AZURE_TENANT_ID: 8caad56b-f716-4068-b468-3bdf8e4d357b
  AZURE_WEBAPP_NAME: meeting-poc-438871-izha3l56k5kdy
  AZURE_RESOURCE_GROUP: bot-meeting-poc-rg
  AZURE_WEBAPP_URL: https://meeting-poc-438871-izha3l56k5kdy.azurewebsites.net
  AZURE_COMMUNICATION_SERVICE_NAME: meeting-poc-438871-acs-izha3l56k5kdy
  DOTNET_VERSION: 10.0.x

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Verify existing pilot and preserved configuration
        shell: pwsh
        run: ./infra/validate-pilot.ps1

  build-test-deploy:
    needs: preflight
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && !inputs.validate_only) ||
       (github.event_name == 'push' && !contains(github.event.head_commit.message, '[validate only]')))
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ env.AZURE_WEBAPP_URL }}/meeting
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore tests/BotMeetings.Tests/BotMeetings.Tests.csproj --locked-mode

      - name: Test
        run: dotnet test tests/BotMeetings.Tests/BotMeetings.Tests.csproj --configuration Release --no-restore

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: acs-calling-client/package-lock.json

      - name: Install ACS browser client dependencies
        working-directory: acs-calling-client
        run: npm ci

      - name: Test ACS browser client
        working-directory: acs-calling-client
        run: npm test

      - name: Build ACS browser client
        working-directory: acs-calling-client
        run: npm run build

      - name: Publish
        run: dotnet publish BotMeetings.csproj --configuration Release --no-restore --output publish -p:BuildCommit=$GITHUB_SHA

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Recheck target before deployment
        shell: pwsh
        run: ./infra/validate-pilot.ps1

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: publish

      - name: Verify deployment
        shell: pwsh
        run: ./infra/validate-pilot.ps1 -ExpectedCommit $env:GITHUB_SHA -PublishedPath ./publish